interface:
  display_name: "Repo Task Proof Loop"
  short_description: "Init repo-local task artifacts, install role-specific subagents, and drive spec → build → evidence → verify → fix loops."
  default_prompt: "Use $repo-task-proof-loop to initialize or inspect the matching repo-local task first. Treat init as a serial prerequisite. Do not run validate or status until init has fully finished. After init succeeds and .agent/tasks/<TASK_ID>/spec.md exists, freeze the spec before coding. In Codex, keep the normal path serial by default. Spawn child agents only if the user explicitly asks for sub-agents, delegation, or parallel agent work. When delegation is authorized and materially helpful, keep `task-builder` inheritance-first as the single integration owner and prefer the installed task-specific helper roles: `task-scout` for cheap lookup work, `task-explorer` for deeper read-only tracing, `task-worker-lite` for narrow low-risk edits, and `task-worker-strong` for bounded riskier edits. Use built-in `explorer` or `worker` only as fallback when those task-specific roles are unavailable in the current product surface. Keep one integration builder responsible for evidence, inspect existing child threads before reuse or resume, and keep every verifier pass fresh."
policy:
  allow_implicit_invocation: false
