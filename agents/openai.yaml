interface:
  display_name: "Repo Task Proof Loop"
  short_description: "Init repo-local task artifacts, route from durable task state, and drive route → freeze → route → build → evidence → verify → fix loops."
  default_prompt: "Use $repo-task-proof-loop to initialize or inspect the matching repo-local task first. Treat init as a serial prerequisite. Do not run validate or status until init has fully finished. After init succeeds, route the task from repo-local artifacts before delegating or freezing the spec. Use `routing.json` plus any dispatch briefs under `.agent/tasks/<TASK_ID>/dispatches/` as the scoped child contract instead of assuming full chat handoff. Before the spec is frozen, only schedule `task-scout` or `task-explorer`. After the spec is frozen, route again and default to child-first orchestration with the installed task-specific helper roles. Keep `task-router` on route decisions, keep `task-builder` inheritance-first as the single integration owner, keep one integration builder responsible for evidence, and keep every verifier pass fresh. Prefer the smallest valid decomposition, state assumptions explicitly, and use built-in `explorer` or `worker` only as fallback when the task-specific roles are unavailable in the current product surface."
policy:
  allow_implicit_invocation: false
